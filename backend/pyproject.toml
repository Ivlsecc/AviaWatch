[project]
name = "aviawatch"
version = "0.1.0"
description = "Мониторинг цен на авиабилеты: Telegram-бот + админка"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx[socks]>=0.27",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "aiogram>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["common*", "sources*", "search*", "bot*", "api*", "worker*", "scheduler*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
