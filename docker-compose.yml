name: aviawatch

# Запуск всего: docker compose up -d --build
# Админка: http://<сервер>:8000 (логин/пароль — ADMIN_USERNAME / ADMIN_PASSWORD из .env)

x-app: &app
  build: .
  image: aviawatch:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://aviawatch:${POSTGRES_PASSWORD:-aviawatch}@postgres:5432/aviawatch
    REDIS_URL: redis://redis:6379/0
    # Прокси с хоста внутри контейнера не работают — задайте явно в .env, если нужны
    HTTP_PROXY: ${APP_HTTP_PROXY:-}
    HTTPS_PROXY: ${APP_HTTP_PROXY:-}
    TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
  volumes:
    - appcache:/app/.cache
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aviawatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aviawatch}
      POSTGRES_DB: aviawatch
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviawatch"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  bot:
    <<: *app
    command: ["python", "-m", "bot.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://aviawatch:${POSTGRES_PASSWORD:-aviawatch}@postgres:5432/aviawatch
      REDIS_URL: redis://redis:6379/0
      HTTP_PROXY: ${APP_HTTP_PROXY:-}
      HTTPS_PROXY: ${APP_HTTP_PROXY:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      METRICS_PORT: "9101"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  api:
    <<: *app
    command: ["python", "-m", "api.main"]
    ports: ["${API_PORT:-8000}:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://aviawatch:${POSTGRES_PASSWORD:-aviawatch}@postgres:5432/aviawatch
      REDIS_URL: redis://redis:6379/0
      HTTP_PROXY: ${APP_HTTP_PROXY:-}
      HTTPS_PROXY: ${APP_HTTP_PROXY:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      API_PORT: "8000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  appcache:
